# Environment for the Paper 1 analysis notebook.
# Versions are those used for the reported run (software_versions.csv).
# CheckM2 additionally requires its reference database (checkm2 database --download).
name: paper1-lactobacilli
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.15
  - numpy=1.23.5
  - pandas=1.5.3
  - matplotlib=3.5.2
  - biopython=1.79
  - jupyterlab
  - prokka=1.14.6
  - panaroo=1.7.0
  - checkm2=1.1.0
  - fastani=1.34
  - blast=2.12.0
  - mafft=7.526
  - fasttree=2.2.0
  - ncbi-datasets-cli
